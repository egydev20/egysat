name: Patch EGY PLAYER APK

on:
  workflow_dispatch:
    inputs:
      old_domain:
        description: 'النطاق القديم (مثل: egyplayer.com)'
        required: true
        default: 'egyplayer.com'
      new_domain:
        description: 'النطاق الجديد'
        required: true
        default: 'panel.egysat.net'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Latest Apktool (v2.10.0)
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar
          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/
          sudo chmod +x /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool.jar

      - name: Download Uber APK Signer
        run: wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Download APK from Hostinger
        run: wget "https://panel.egysat.net/egyplayer.apk" -O app.apk

      - name: Decompile APK
        run: apktool d app.apk -o decoded_apk

      - name: Replace Old Domain with New Domain
        run: |
          OLD="${{ github.event.inputs.old_domain }}"
          NEW="${{ github.event.inputs.new_domain }}"
          echo "Replacing $OLD with $NEW..."
          find decoded_apk -type f \( -name "*.xml" -o -name "*.smali" -o -name "*.json" \) -exec sed -i "s|$OLD|$NEW|g" {} +

      - name: Recompile APK with AAPT2
        run: apktool b --use-aapt2 decoded_apk -o new_unsigned.apk

      - name: Sign Recompiled APK
        run: java -jar signer.jar -a new_unsigned.apk --allowResign -o output_dir

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: EGY_PLAYER_Updated
          path: output_dir/*.apk

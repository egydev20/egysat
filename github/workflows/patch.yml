name: Patch EGY PLAYER APK

on:
  workflow_dispatch:
    inputs:
      old_domain:
        description: 'النطاق أو الرابط القديم (مثل: panel.egyplayer.com)'
        required: true
        default: 'panel.egyplayer.com'
      new_domain:
        description: 'النطاق الجديد'
        required: true
        default: 'panel.egysat.net'

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Download Uber APK Signer
        run: wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Download APK from Hostinger
        run: wget "https://panel.egysat.net/egyplayer.apk" -O app.apk

      - name: Decompile APK
        run: apktool d app.apk -o decoded_apk

      - name: Replace Old Domain with New Domain
        run: |
          OLD="${{ github.event.inputs.old_domain }}"
          NEW="${{ github.event.inputs.new_domain }}"
          echo "Replacing $OLD with $NEW..."
          find decoded_apk -type f \( -name "*.xml" -o -name "*.smali" -o -name "*.json" \) -exec sed -i "s|$OLD|$NEW|g" {} +

      - name: Recompile APK
        run: apktool b decoded_apk -o new_unsigned.apk

      - name: Sign Recompiled APK
        run: java -jar signer.jar -a new_unsigned.apk --allowResign -o output_dir

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: EGY_PLAYER_Updated
          path: output_dir/*.apk
